# Shared NGINX locations, included by local and optional TLS virtual hosts.
root /var/lib/scripts-tools/webroot;
index index.php;
autoindex off;
server_tokens off;
client_max_body_size 16m;
location = / { return 302 /cacti/; }
location = /cacti { return 301 /cacti/; }
location ^~ /mrtg { return 404; }
# Block sensitive data, scripts, dotfiles and alternative PHP extensions.
location ~* ^/cacti/(?:rra|log|scripts|cli|cache)(?:/|$) { return 404; }
location ~* ^/cacti/(?:include/config\.php|include/global\.php)$ { return 404; }
location ~* ^/cacti/.*\.(?:phtml|phar|php[0-9])$ { return 404; }
location ~ (^|/)\. { return 404; }
location /cacti/ { try_files $uri $uri/ /cacti/index.php?$query_string; }
location ~ ^/cacti/.*\.php$ {
    try_files $uri =404;
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    fastcgi_read_timeout 120s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location / { return 404; }
