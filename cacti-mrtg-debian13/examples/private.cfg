# scripts-tools PRIVATE MRTG collection (admin-only, no Apache mapping).
# This is optional; Cacti is the customer-facing graph service.
WorkDir: /var/lib/mrtg-private
Interval: 5
Options[_]: growright,bits
EnableIPv6: no
# Targets are appended by mrtg_private.sh. Do not host /var/lib/mrtg-private in Apache.
Include: /etc/mrtg/scripts-tools/targets.cfg
