# Example only. Install trusted certificates and update server_name first.
# Copy to /etc/nginx/sites-available/scripts-tools-cacti-tls.conf, symlink
# from sites-enabled, run nginx -t and reload. Do not enable before certs exist.
server {
    listen 443 ssl;
    server_name monitoring.example.com;
    ssl_certificate /etc/letsencrypt/live/monitoring.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/scripts-tools-cacti-tls-access.log;
    error_log /var/log/nginx/scripts-tools-cacti-tls-error.log;
    include /etc/nginx/snippets/scripts-tools-cacti-locations.conf;
}
