# Loopback-only NGINX bootstrap. Access through an SSH port forward.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log /var/log/nginx/scripts-tools-cacti-access.log;
    error_log /var/log/nginx/scripts-tools-cacti-error.log;
    include /etc/nginx/snippets/scripts-tools-cacti-locations.conf;
}
