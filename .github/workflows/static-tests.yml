name: Static validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - name: Validate shell, PHP and security guards
        run: bash cacti-mrtg-debian13/tests/check_static.sh
